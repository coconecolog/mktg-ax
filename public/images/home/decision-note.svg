<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 720" width="510" height="720" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">MKTG.AX DECISION NOTE 記入イメージ</title>
  <desc id="d">次の施策を、説明できる形にする。目的、優先する施策、判断に使う数字、次の行動を1枚に整理するノートの記入イメージ。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <style>
      text { font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "YuGothic", "Meiryo", sans-serif; }
      .eyebrow { font-size: 11px; font-weight: 700; fill: #555; letter-spacing: 0.02em; }
      .meta { font-size: 11px; fill: #777; }
      .title { font-size: 24px; font-weight: 700; fill: #111; }
      .label { font-size: 11px; font-weight: 700; fill: #444; }
      .value { font-size: 15px; fill: #222; }
      .box-label { font-size: 11px; font-weight: 700; fill: #333; }
      .box-text { font-size: 14px; font-weight: 700; fill: #111; }
      .note { font-size: 10px; fill: #888; }
    </style>
  </defs>

  <rect x="30" y="30" width="450" height="652" fill="#fff" stroke="#e6e6e6" filter="url(#shadow)"/>

  <text x="58" y="69" class="eyebrow">MKTG.AX / DECISION NOTE</text>
  <text x="452" y="69" class="meta" text-anchor="end">記入イメージ</text>

  <text x="58" y="122" class="title">次の施策を、</text>
  <text x="58" y="162" class="title">説明できる形にする。</text>
  <rect x="58" y="192" width="394" height="3" fill="#111"/>

  <text x="58" y="245" class="label">目的</text>
  <text x="60" y="270" class="value">［売上・利益の目標］</text>
  <rect x="58" y="286" width="394" height="1" fill="#e5e5e5"/>

  <text x="58" y="314" class="label">優先する施策</text>
  <text x="60" y="339" class="value">［顧客・強み・予算から選ぶ］</text>
  <rect x="58" y="355" width="394" height="1" fill="#e5e5e5"/>

  <text x="58" y="383" class="label">判断に使う数字</text>
  <text x="60" y="408" class="value">［商談率・受注率・回収期間］</text>
  <rect x="58" y="424" width="394" height="1" fill="#e5e5e5"/>

  <text x="58" y="452" class="label">次の行動</text>
  <text x="60" y="477" class="value">［担当者・期限・見直し条件］</text>
  <rect x="58" y="493" width="394" height="1" fill="#e5e5e5"/>

  <rect x="58" y="516" width="394" height="100" fill="#f3f3f3"/>
  <text x="74" y="543" class="box-label">社内に伝えること</text>
  <text x="74" y="571" class="box-text">何をするか。何で測るか。</text>
  <text x="74" y="596" class="box-text">どの条件で続ける・見直すか。</text>

  <text x="58" y="651" class="note">判断項目を示すイメージです。実績値ではありません。</text>
</svg>
